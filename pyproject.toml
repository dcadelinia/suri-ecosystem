[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suri-ecosystem"
version = "1.0.0"
description = "AI-powered microplastic remediation and localized manufacturing ecosystem utilizing NVIDIA edge compute."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
